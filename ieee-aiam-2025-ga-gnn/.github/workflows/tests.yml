name: Python tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ieee-aiam-2025-ga-gnn/code/requirements.txt
      - name: Install
        run: python -m pip install -e './ieee-aiam-2025-ga-gnn/code[test]'
      - name: Test
        run: python -m pytest -q ieee-aiam-2025-ga-gnn/code/tests
