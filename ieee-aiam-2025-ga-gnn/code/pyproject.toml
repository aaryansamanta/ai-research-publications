[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiam-ga-gnn"
version = "0.1.0"
description = "Quantum-Inspired Hybrid Genetic Algorithm and Graph Neural Network Ensemble for Multimodal Classification"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest>=8"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]

[project.scripts]
aiam-gnn = "aiam_gnn.cli:main"

[tool.setuptools]
packages = ["aiam_gnn"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
